services:
  rag-web:
    build:
      context: .
    ports:
      - "${WEB_PORT:-5000}:${PORT:-5000}"
    environment:
      PORT: ${PORT:-5000}
      DOCS_DIR: ${DOCS_DIR:-/app/docs}
      DB_DIR: ${DB_DIR:-/app/chroma_txt_db}
      COLLECTION_NAME: ${COLLECTION_NAME:-local_rag_docs}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      MAX_DISTANCE: ${MAX_DISTANCE:-1.0}
      MAX_CASES: ${MAX_CASES:-8}
    volumes:
      - ./docs:${DOCS_DIR:-/app/docs}:ro
      - chroma_data:${DB_DIR:-/app/chroma_txt_db}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_models:
